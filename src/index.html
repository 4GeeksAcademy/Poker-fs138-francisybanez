<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/img/4geeks.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Rigo with Vanilla.js</title>

    <!-- Fontawesome is our recomended library for icons -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.2.0/css/all.css"
      integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Write your HTML code here, you can delete everything withing the body tags -->
    <div class="d-block mx-auto mt-5 bg-white rounded shadow">
      <div id="theCard" class="card rounded shadow bg-white my-5">
        <p id="cardContent"></p>
      </div> 
    </div>

    <button id="btn-new" class="btn btn-light mt-3 d-block mx-auto mb-4 rounded shadow">New cards</button>

    <div class="mt-2 d-flex flex-column flex-sm-row gap-2 justify-content-center align-items-center px-3">
     <label class="d-flex align-items-center gap-1 text-white w-100 rounded shadow">
     Wide: <input id="input-wide" type="number" value="300" class="form-control">
     </label>
     <label class="d-flex align-items-center gap-1 text-white w-100 rounded shadow">
     High: <input id="input-high" type="number" value="440" class="form-control">
     </label>
    </div>

    <!-- Do not delete this script tag, this is what connects your HTML with the Javascript code -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
